modmap:
  - remap:
      # CapsLock: 長押しで左Ctrl、単打で変換キー
      KEY_CAPSLOCK:
        held: KEY_LEFTCTRL
        alone: KEY_HENKAN
        alone_timeout_millis: 200

      # 左下Ctrl: 長押しでHyperキー、単打でSuper（Windows）キー
      KEY_LEFTCTRL:
        held: [KEY_RIGHTSHIFT, KEY_RIGHTCTRL, KEY_LEFTALT, Super_L]
        alone: Super_L
        alone_timeout_millis: 200

      # 左Alt: 右Ctrl化（MacのCmdキー相当としてGUI操作・コピペ・検索に利用）
      Alt_L: Ctrl_R

      # 無変換: 左Alt代用
      KEY_MUHENKAN: Alt_L

      # 右Alt: 変換キー
      KEY_RIGHTALT: KEY_HENKAN

keymap:
  # =========================================================================
  # 一般アプリ向け Emacs風キーバインド (Terminal / Zed 外で適用)
  # ※ CapsLock(左Ctrl) + 各キー でカーソル移動・編集を発火
  # ※ コピペやページ検索は 左Alt(右Ctrl) + 各キー で通常通り利用可能
  # =========================================================================
  - name: Emacs-like key bindings (outside of terminal)
    application:
      not:
        - ghostty
        - com.mitchellh.ghostty
        - zed
        - dev.zed.Zed
        - ptyxis
        - org.gnome.Ptyxis
    remap:
      Ctrl_L-b: left
      Ctrl_L-f: right
      Ctrl_L-p: up
      Ctrl_L-n: down
      Ctrl_L-a: home
      Ctrl_L-e: end
      Ctrl_L-h: backspace
      Ctrl_L-d: [delete, { set_mark: false }]
      Ctrl_L-k: [Shift-end, C-x, { set_mark: false }]

  # =========================================================================
  # Hyperキー設定 (左下Ctrl長押し + 各キー)
  # =========================================================================
  - name: Hyper key setting
    remap:
      SHIFT-Ctrl_R-M-SUPER-c: Ctrl_L-c
      SHIFT-Ctrl_R-M-SUPER-v: Shift-Ctrl_L-v
      SHIFT-Ctrl_R-M-SUPER-x: Ctrl_L-x
      SHIFT-Ctrl_R-M-SUPER-tab: M-tab
